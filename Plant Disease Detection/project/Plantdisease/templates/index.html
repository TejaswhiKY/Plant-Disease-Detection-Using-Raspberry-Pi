<!DOCTYPE html>
<html>
<head>
    <title>Plant Disease Detection</title>
    <link rel="stylesheet" href="/static/style.css">

    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right,#b7f8a7,#d7ffd9);
            text-align:center;
            margin:0;
        }

        .container{
            width:450px;
            margin:50px auto;
            background:#fff;
            padding:30px;
            border-radius:20px;
            box-shadow:0 0 15px rgba(0,0,0,0.2);
        }

        h1{
            color:#2e7d32;
        }

        h2{
            color:#333;
        }

        button{
            width:220px;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#2e7d32;
            color:white;
            font-size:18px;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background:#1b5e20;
        }

        input[type=file]{
            margin-top:10px;
        }

        hr{
            margin:30px 0;
        }
    </style>
</head>

<body>

<div class="container">

<h1> Plant Disease Detection</h1>

<h2> Camera Mode</h2>

<a href="/camera">
    <button type="button">Open Live Camera</button>
</a>

<hr>

<h2> Upload Image</h2>

<form action="/upload" method="POST" enctype="multipart/form-data">

<input type="file" name="file" required>

<br><br>

<button type="submit">Upload Image</button>

</form>

</div>

</body>
</html>
